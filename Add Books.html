<!DOCTYPE HTML>
<html>
    <head>
        <title>Add Books</title>
    </head>
    <body>
        <form>
            <center>
                <h1><em>Add Books</em></h1>
                <p><i>Enter book details in this demonstration form.</i></p>
                <label for="bookid">Book ID:</label>

                <input type="text" name="booktitle" id="booktitle" placeholder="Enter the Book Title"><br><br>
                <label for="author">Author:</label>
                <input type="text" name="author" id="author" placeholder="Enter the Author Name"><br><br>
                <label for="quantity">Quantity:</label>
                <input type="number" name="quantity" id="quantity" placeholder="Enter the Quantity"><br><br>
                <input type="Submit" name="submit" id=""submit>
                <a href="Index.html"><h3><i>Back to Home Page</i></h3></a><br><br>

        </form>
