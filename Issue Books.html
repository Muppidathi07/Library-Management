<!Doctype html>
<html>
    <head>
        <title>Issue Books</title>
    </head>
    <body>
        <form>
            <center>
                <h1>
                    <em>Issue Books</em>
                </h1>
                <p><i>Enter the details for a book issue.</i></p>
                <label for="bookid">Book ID:</label>
                <input type="number" name="bookid" id="bookid" placeholder="Enter the Book Id"><br><br>
                <label for="studentname">Student Name:</label>
                <input type="text" name="studentname" id="studentname" placeholder="Enter the name of the student"><br><br>
                <label for="studentid">Student ID:</label>
                <input type="number" name="studentid" id="studentid" placeholder="Enter the Student Id"><br><br>
                <label for="issuedate">Issue Date:</label>
                <input type="date" name="issuedate" id="issuedate"><br><br>
                <label for="duedate">Due Date:</label>
                <input type="date" name="duedate" id="duedate"><br><br>
                <input type="Submit" name="submit" id="submit"><br><br>
                <a href="Index.html"><h3><i>Back to Home Page</i></h3></a><br><br>
            </center>
        </form>
    </body>
</html>
