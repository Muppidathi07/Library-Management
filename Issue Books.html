<!Doctype html>
<html>
    <head>
        <title>Issue Books</title>
    </head>
    <body>
        <form>
            <h1><em>Issue Books</em><h1>
                <p><i>Enter the details for a book issue.</i></p>
                <label for="bookid"><b>Book ID:</b></label>
                <input type="number" name="bookid" id="bookid" placeholder="Enter the Book Id">
                <label for="studentname"><b>Student Name:</b></label>
                <input type="text" name="studentname" id="studentname" placeholder="Enter the name of the student">
                <label for="studentid"><b>Student ID:</b></label>
                <input type="number" name="studentid" id="studentid" placeholder="Enter the Student Id">
                <label for="issuedate"><b>Issue Date:</b></label>
                <input type="date" name="issuedate" id="issuedate">
                <label for="duedate"><b>Due Date:</b></label>
                <input type="date" name="duedate" id="duedate">
                <input type="Submit" name="submit" id="submit" placeholder="(demonstration only)">
                <a href="Index.html"><h3><b>Back to Home Page</b></h3></a>
        </form>
    </body>
</html>
